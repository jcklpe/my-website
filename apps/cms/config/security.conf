ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
</Directory>

<FilesMatch "^(wp-config.*\.php|xmlrpc\.php|\.user\.ini|\.env.*)$">
    Require all denied
</FilesMatch>

# Uploads remain writable; neither PHP nor uploaded per-directory rules may run here.
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    php_admin_flag engine Off
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
