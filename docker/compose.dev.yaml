services:
  cms:
    ports:
      - '127.0.0.1:8080:80'

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      DOMAIN: ${DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
